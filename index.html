/* DIGITALS · TELECTRONIC PATTERN */
.tel-kpis {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  background: linear-gradient(135deg, var(--bg2), var(--bg));
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 1.6rem;
  margin-bottom: 1.6rem;
  position: relative;
  overflow: hidden;
}
@media (max-width: 900px) { .tel-kpis { grid-template-columns: repeat(2, 1fr); } }
.tel-kpis::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .35;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 36px 36px;
  mask-image: radial-gradient(ellipse 70% 80% at 50% 50%, black 30%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse 70% 80% at 50% 50%, black 30%, transparent 75%);
}
.tel-kpi {
  position: relative; z-index: 2;
  text-align: left;
  padding: .4rem .2rem;
}
.tel-kpi .suf {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.55rem; letter-spacing: 0.22em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: .5rem;
  font-weight: 700;
}
.tel-kpi .num {
  font-family: 'Inter Tight', sans-serif;
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
  color: var(--ink);
  background: linear-gradient(180deg, var(--ink), rgba(244,236,220,0.45));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.tel-kpi .lbl {
  font-size: 0.78rem;
  color: var(--ink-soft);
  margin-top: .4rem;
  line-height: 1.3;
}

.tel-pillars {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 12px; margin-bottom: 1.6rem;
}
@media (max-width: 900px) { .tel-pillars { grid-template-columns: 1fr; } }
.tel-pillar {
  position: relative;
  padding: 1.4rem 1.4rem;
  border: 1px solid var(--pillar-color, var(--accent));
  border-radius: 12px;
  background: linear-gradient(180deg, var(--pillar-bg, rgba(255,90,31,0.06)), transparent);
  overflow: hidden;
}
.tel-pillar::before {
  content: ''; position: absolute;
  top: -30px; right: -30px;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--pillar-glow, rgba(255,90,31,0.25)), transparent 70%);
  opacity: .35;
}
.tel-pillar .ico {
  width: 38px; height: 38px;
  border-radius: 8px;
  background: var(--pillar-color, var(--accent));
  display: inline-flex; align-items: center; justify-content: center;
  margin-bottom: .8rem;
  position: relative; z-index: 2;
  color: var(--bg);
  font-family: 'Inter Tight', sans-serif;
  font-weight: 800;
  font-size: 1rem;
}
.tel-pillar .kicker {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.2em;
  color: var(--pillar-color, var(--accent));
  text-transform: uppercase;
  margin-bottom: .35rem;
  display: block;
}
.tel-pillar h4 {
  font-family: 'Inter Tight', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.01em;
  margin-bottom: .5rem;
  position: relative; z-index: 2;
}
.tel-pillar p {
  font-size: 0.85rem; line-height: 1.6;
  color: var(--ink-soft);
  position: relative; z-index: 2;
}
.tel-pillar p em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  color: var(--ink);
}

/* The squad team grid */
.tel-squad-head {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin: 1.8rem 0 1rem;
  flex-wrap: wrap; gap: 1rem;
}
.tel-squad-head .kicker {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.22em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: .35rem;
}
.tel-squad-head h3 {
  font-family: 'Inter Tight', sans-serif;
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: -0.025em;
  color: var(--ink);
  text-transform: uppercase;
  margin: 0;
  line-height: 1.05;
}
.tel-squad-head h3 em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-weight: 400;
  text-transform: none;
  color: var(--accent);
}
.tel-squad-head .right {
  font-size: 0.72rem;
  color: var(--ink-soft);
  text-align: right;
  line-height: 1.5;
}

.tel-team-grid {
  display: grid; grid-template-columns: repeat(6, 1fr);
  gap: 10px;
  margin-bottom: 1.6rem;
}
@media (max-width: 1100px) { .tel-team-grid { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 700px)  { .tel-team-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 480px)  { .tel-team-grid { grid-template-columns: repeat(2, 1fr); } }
.tel-team-card {
  position: relative;
  aspect-ratio: 3/4;
  border-radius: 10px;
  overflow: hidden;
  background: var(--bg2);
  border: 1px solid var(--line);
  transition: transform .35s ease, box-shadow .35s ease, border-color .3s;
}
.tel-team-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 20px 40px rgba(255,90,31,0.20);
  border-color: var(--accent);
}
.tel-team-card img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center 18%;
  filter: grayscale(100%);
  transition: filter .4s ease;
  display: block;
}
.tel-team-card:hover img { filter: grayscale(0%); }
.tel-team-card::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,.85) 100%);
  pointer-events: none;
}
.tel-team-card .tm-meta {
  position: absolute; bottom: 8px; left: 10px; right: 10px;
  z-index: 2;
}
.tel-team-card .tm-name {
  font-family: 'Inter Tight', sans-serif;
  font-size: 0.92rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: #fff;
  line-height: 1;
}
.tel-team-card .tm-role {
  font-size: 0.55rem;
  letter-spacing: 0.12em;
  color: var(--accent);
  text-transform: uppercase;
  margin-top: 4px;
  font-weight: 700;
}

/* Partnerships */
.tel-partners {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 1.4rem;
}
@media (max-width: 900px) { .tel-partners { grid-template-columns: repeat(2, 1fr); } }
.tel-partner {
  text-align: center;
  padding: 1.4rem 1.2rem;
  border: 1px solid var(--p-color, var(--accent));
  border-radius: 12px;
  background: linear-gradient(180deg, var(--p-bg, rgba(255,255,255,0.04)), transparent 60%);
  transition: transform .3s, box-shadow .3s;
}
.tel-partner:hover { transform: translateY(-3px); box-shadow: 0 16px 32px rgba(0,0,0,0.35); }
.tel-partner .name {
  font-family: 'Inter Tight', sans-serif;
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--p-color, var(--accent));
  letter-spacing: -0.025em;
  line-height: 1;
}
.tel-partner .tag {
  font-size: 0.58rem; letter-spacing: 0.18em;
  color: var(--ink);
  text-transform: uppercase;
  margin-top: .55rem;
  font-weight: 800;
}
.tel-partner .detail {
  font-size: 0.74rem; line-height: 1.45;
  color: var(--ink-soft);
  margin-top: .6rem;
}

/* Why client callout */
.tel-why-callout {
  padding: 1.6rem 1.5rem;
  border: 1px solid var(--accent);
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(255,90,31,0.06), transparent 80%);
}
.tel-why-callout h4 {
  font-family: 'Inter Tight', sans-serif;
  font-weight: 700;
  font-size: 1.25rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.01em;
  margin-bottom: .8rem;
}
.tel-why-callout h4 .accent-orange { color: var(--accent); font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; text-transform: none; }
.tel-why-callout p {
  font-size: 0.92rem; line-height: 1.7;
  color: var(--ink-soft);
}
.tel-why-callout p b { color: var(--ink); font-weight: 500; }
.tel-why-callout p em { font-style: italic; color: var(--accent); }

/* Cofounders */
.cof-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 1.4rem;
}
@media (max-width: 800px) { .cof-grid { grid-template-columns: 1fr; } }
.cof-card {
  padding: 1.6rem 1.5rem;
  border: 1px solid var(--cof-color, var(--accent));
  border-radius: 12px;
  background: linear-gradient(180deg, var(--cof-bg, rgba(255,90,31,0.04)), transparent);
}
.cof-card .kicker {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.22em;
  color: var(--cof-color, var(--accent));
  text-transform: uppercase;
  margin-bottom: .35rem;
  display: block;
}
.cof-card h4 {
  font-family: 'Inter Tight', sans-serif;
  font-weight: 800;
  font-size: 1.3rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.02em;
  margin-bottom: 1rem;
}
.cof-card ul {
  list-style: none;
  display: flex; flex-direction: column; gap: .55rem;
}
.cof-card ul li {
  font-size: 0.85rem; line-height: 1.5;
  color: var(--ink-soft);
  padding-left: 1.2rem;
  position: relative;
}
.cof-card ul li::before {
  content: '◦'; position: absolute; left: 0;
  color: var(--cof-color, var(--accent));
  font-weight: 600;
}
.cof-card ul li b { color: var(--ink); font-weight: 600; }

/* Stack section */
.stack-hito {
  margin-bottom: 1.6rem;
  padding: 1.4rem 1.5rem;
  border: 1px solid #FF0050;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(255,0,80,0.10), transparent 80%);
}
.stack-hito .head {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: .6rem;
  flex-wrap: wrap;
}
.stack-hito .badge {
  background: #FF0050;
  color: #fff;
  padding: .3rem .7rem;
  border-radius: 999px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.18em;
  font-weight: 700;
}
.stack-hito h4 {
  margin: 0;
  font-family: 'Inter Tight', sans-serif;
  font-weight: 700;
  font-size: 1.25rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.01em;
}
.stack-hito h4 .hi { color: #FF0050; }
.stack-hito p {
  font-size: 0.92rem; line-height: 1.65;
  color: var(--ink-soft);
}
.stack-hito p b { color: var(--ink); font-weight: 500; }
.stack-hito p em { color: var(--accent); font-style: italic; }

.stack-list {
  display: flex; flex-direction: column;
  gap: 14px;
}
.stack-row {
  padding: 1.4rem 1.4rem;
  border: 1px solid var(--stack-color, var(--accent));
  border-radius: 12px;
  background: linear-gradient(135deg, var(--stack-bg, rgba(255,90,31,0.06)), transparent 60%);
  position: relative; overflow: hidden;
}
.stack-row::before {
  content: ''; position: absolute;
  top: -40px; right: -40px;
  width: 160px; height: 160px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--stack-glow, rgba(255,90,31,0.25)), transparent 70%);
  opacity: .35;
  pointer-events: none;
}
.stack-row .row-inner {
  display: grid; grid-template-columns: 1fr 2fr;
  gap: 24px;
  align-items: flex-start;
  position: relative; z-index: 2;
}
@media (max-width: 800px) { .stack-row .row-inner { grid-template-columns: 1fr; } }
.stack-row .row-meta .tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.55rem; letter-spacing: 0.22em;
  color: var(--stack-color, var(--accent));
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: .5rem;
  display: inline-block;
  padding: .2rem .6rem;
  background: rgba(11,10,8,0.55);
  border-radius: 999px;
  border: 1px solid var(--stack-color, var(--accent));
}
.stack-row .row-meta h4 {
  font-family: 'Inter Tight', sans-serif;
  font-weight: 800;
  font-size: 1.2rem;
  color: var(--ink);
  margin-bottom: .5rem;
}
.stack-row .row-meta p {
  font-size: 0.84rem; line-height: 1.6;
  color: var(--ink-soft);
}
.stack-row .row-items {
  display: flex; flex-direction: column; gap: 8px;
}
.stack-row .row-item {
  padding: .7rem .9rem;
  background: rgba(11,10,8,0.55);
  border-radius: 8px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--stack-color, var(--accent));
}
.stack-row .row-item .nm {
  font-family: 'Inter Tight', sans-serif;
  font-weight: 800;
  font-size: 0.95rem;
  color: var(--ink);
  margin-bottom: .2rem;
}
.stack-row .row-item .use {
  font-size: 0.78rem; line-height: 1.45;
  color: var(--ink-soft);
}

/* ====================================
   WEB BODY EXTRAS · gallery / quotes / FAQ / forms / partners
   ==================================== */
.web-gallery {
  display: grid; grid-template-columns: 2fr 1fr 1fr;
  grid-template-rows: 280px 280px;
  gap: .5rem;
  margin-top: 1rem;
}
@media (max-width: 900px) { .web-gallery { grid-template-columns: 1fr 1fr; grid-template-rows: 200px 200px 200px; } }
@media (max-width: 600px) { .web-gallery { grid-template-columns: 1fr; grid-template-rows: 200px repeat(5, 160px); } }
.web-gallery > div {
  background-size: cover; background-position: center;
  border-radius: 12px;
  border: 1px solid var(--style-line);
  position: relative;
  overflow: hidden;
  transition: transform .3s;
}
.web-gallery > div:hover { transform: scale(1.02); }
.web-gallery > div::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.55) 100%);
  pointer-events: none;
}
.web-gallery .g-label {
  position: absolute; bottom: 1rem; left: 1rem; right: 1rem;
  z-index: 2;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.18em;
  color: #fff;
  text-transform: uppercase;
}
.web-gallery .g-label b {
  display: block;
  font-family: var(--style-display), sans-serif;
  font-weight: 700; font-size: 0.95rem;
  margin-top: .25rem;
  letter-spacing: -0.005em;
  text-transform: uppercase;
}
.web-gallery .g1 { grid-row: span 2; }

/* Testimonios / quotes */
.web-quotes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 1rem; }
@media (max-width: 900px) { .web-quotes { grid-template-columns: 1fr; } }
.web-quote {
  padding: 1.6rem 1.5rem;
  border: 1px solid var(--style-line);
  border-radius: 14px;
  background: var(--style-bg2);
  display: flex; flex-direction: column; gap: 1rem;
}
.web-quote .qm {
  font-family: var(--style-italic), serif;
  font-style: italic;
  font-size: 4rem; line-height: .3;
  color: var(--style-accent);
  margin-bottom: 0;
}
.web-quote .text {
  font-family: var(--style-italic), serif;
  font-style: italic;
  font-size: 1.05rem; line-height: 1.5;
  color: var(--style-ink);
  flex: 1;
}
.web-quote .author {
  display: grid; grid-template-columns: 40px 1fr;
  gap: .8rem; align-items: center;
  padding-top: 1rem;
  border-top: 1px dashed var(--style-line);
}
.web-quote .author .av {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--style-accent);
  color: var(--style-bg);
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--style-display), sans-serif;
  font-weight: 800;
  font-size: 1rem;
}
.web-quote .author .info b {
  font-family: var(--style-display), sans-serif;
  font-weight: 700;
  font-size: 0.88rem;
  color: var(--style-ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
  display: block;
}
.web-quote .author .info span {
  font-size: 0.72rem; color: var(--style-soft);
  letter-spacing: 0.04em;
}

/* FAQ accordion */
.web-faq { display: flex; flex-direction: column; gap: .55rem; margin-top: 1rem; }
.web-faq-item {
  padding: 1.1rem 1.4rem;
  border: 1px solid var(--style-line);
  border-radius: 10px;
  background: var(--style-bg2);
  transition: border-color .25s;
}
.web-faq-item:hover { border-color: var(--style-accent); }
.web-faq-item .q {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--style-display), sans-serif;
  font-weight: 700;
  font-size: 1rem;
  color: var(--style-ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
  cursor: pointer;
}
.web-faq-item .q .plus {
  font-family: var(--style-display), sans-serif;
  font-weight: 400;
  font-size: 1.6rem;
  color: var(--style-accent);
  line-height: 1;
}
.web-faq-item .a {
  margin-top: .8rem;
  padding-top: .8rem;
  border-top: 1px dashed var(--style-line);
  font-family: var(--style-body), sans-serif;
  font-size: 0.88rem; line-height: 1.65;
  color: var(--style-soft);
}

/* Form mockup · contact / cotizar */
.web-form-mock {
  padding: 2rem 1.8rem;
  border: 1px solid var(--style-line);
  border-radius: 14px;
  background: var(--style-bg2);
  display: grid; grid-template-columns: 1fr 1.2fr;
  gap: 2rem; align-items: flex-start;
}
@media (max-width: 900px) { .web-form-mock { grid-template-columns: 1fr; } }
.web-form-mock .meta h4 {
  font-family: var(--style-display), sans-serif;
  font-weight: 700;
  font-size: 1.5rem;
  color: var(--style-ink);
  text-transform: uppercase;
  letter-spacing: -0.015em;
  line-height: 1.1;
  margin-bottom: .8rem;
}
.web-form-mock .meta h4 em {
  font-family: var(--style-italic), serif;
  font-style: italic;
  color: var(--style-accent);
  font-weight: 400;
  text-transform: none;
}
.web-form-mock .meta p {
  font-size: 0.92rem; line-height: 1.65;
  color: var(--style-soft);
  margin-bottom: 1.2rem;
}
.web-form-mock .meta .checklist {
  list-style: none;
  display: flex; flex-direction: column; gap: .45rem;
}
.web-form-mock .meta .checklist li {
  font-size: 0.84rem; line-height: 1.5;
  color: var(--style-ink);
  padding-left: 1.4rem;
  position: relative;
}
.web-form-mock .meta .checklist li::before {
  content: '✓'; position: absolute; left: 0; top: 0;
  color: var(--style-accent);
  font-weight: 700;
}
.web-form-mock .fields { display: flex; flex-direction: column; gap: .55rem; }
.web-form-mock .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; }
.web-form-mock .field-row.full { grid-template-columns: 1fr; }
.web-form-mock .field {
  padding: .9rem 1rem;
  background: var(--style-bg);
  border: 1px solid var(--style-line);
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  color: var(--style-soft);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.web-form-mock .field.value {
  color: var(--style-ink);
  border-color: var(--style-accent);
  background: var(--style-bg2);
}
.web-form-mock .submit-cta {
  margin-top: .5rem;
  padding: 1rem 1.4rem;
  background: var(--style-accent);
  color: #FFFFFF;
  border: 0; border-radius: 100px;
  font-family: var(--style-display), sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  text-align: center;
  cursor: pointer;
}

/* Pop talents grid · marcas que vistieron */
.pop-talents-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: .55rem;
}
@media (max-width: 1100px) { .pop-talents-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 700px)  { .pop-talents-grid { grid-template-columns: repeat(2, 1fr); } }
.pop-talent {
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  padding: 1rem;
  display: flex; flex-direction: column; justify-content: space-between;
  position: relative;
  overflow: hidden;
  transition: transform .25s, box-shadow .25s;
}
.pop-talent:hover { transform: scale(1.04) rotate(-1deg); box-shadow: 0 14px 30px rgba(0,0,0,0.18); }
.pop-talent.t1 { background: var(--style-accent);  color: #FFFFFF; }
.pop-talent.t2 { background: var(--style-accent2); color: #0E0A06; }
.pop-talent.t3 { background: var(--style-accent3); color: #0E0A06; }
.pop-talent.t4 { background: #0E0A06;              color: var(--style-bg); }
.pop-talent .y {
  font-family: 'Space Mono', monospace;
  font-size: 0.58rem; letter-spacing: 0.18em;
  opacity: .85;
  text-transform: uppercase;
}
.pop-talent .name {
  font-family: var(--style-display), sans-serif;
  font-weight: 900;
  font-size: 1.5rem; line-height: 1;
  letter-spacing: -0.02em;
  text-transform: uppercase;
}
.pop-talent .item {
  font-size: 0.72rem;
  line-height: 1.4;
  opacity: .9;
}

/* Pop stickers · download grid */
.pop-stickers {
  display: grid; grid-template-columns: repeat(6, 1fr);
  gap: .5rem;
  padding: 1.5rem;
  border: 1px dashed var(--style-line);
  border-radius: 16px;
  background: var(--style-bg2);
}
@media (max-width: 700px) { .pop-stickers { grid-template-columns: repeat(3, 1fr); } }
.pop-sticker {
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  padding: 1rem;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--style-display), sans-serif;
  font-weight: 800;
  font-size: 0.78rem;
  line-height: 1;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: -0.005em;
  transform-origin: center;
  transition: transform .25s;
  cursor: pointer;
}
.pop-sticker:hover { transform: rotate(8deg) scale(1.06); }
.pop-sticker.s1 { background: var(--style-accent);  color: #FFFFFF; }
.pop-sticker.s2 { background: var(--style-accent2); color: #0E0A06; }
.pop-sticker.s3 { background: var(--style-accent3); color: #0E0A06; }
.pop-sticker.s4 { background: #0E0A06;              color: var(--style-bg); }
.pop-sticker.s5 { background: var(--style-bg);      color: #0E0A06; border: 2px solid #0E0A06; }
.pop-sticker.s6 { background: var(--style-accent3); color: var(--style-accent); border: 3px solid var(--style-accent); }

/* Verde reports Q1-Q4 grid */
.verde-reports { display: grid; grid-template-columns: repeat(4, 1fr); gap: .8rem; margin-top: 1rem; }
@media (max-width: 900px) { .verde-reports { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 500px) { .verde-reports { grid-template-columns: 1fr; } }
.verde-report {
  padding: 1.4rem 1.3rem;
  border: 1px solid var(--style-line);
  border-radius: 12px;
  background: var(--style-bg2);
  display: flex; flex-direction: column; gap: .55rem;
  position: relative;
  overflow: hidden;
  transition: transform .25s, border-color .25s;
}
.verde-report:hover { transform: translateY(-3px); border-color: var(--style-accent); }
.verde-report .q {
  font-family: var(--style-display), serif;
  font-weight: 800;
  font-size: 2.4rem; line-height: 1;
  color: var(--style-accent);
  letter-spacing: -0.03em;
}
.verde-report h6 {
  font-family: var(--style-display), serif;
  font-weight: 700; font-size: 1rem;
  color: var(--style-ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
}
.verde-report p {
  font-size: 0.78rem; line-height: 1.5;
  color: var(--style-soft);
}
.verde-report .dl {
  margin-top: auto;
  padding-top: .65rem;
  border-top: 1px dashed var(--style-line);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.12em;
  color: var(--style-accent);
  text-transform: uppercase;
}

/* Verde testimonio mandante */
.verde-testimonio {
  display: grid; grid-template-columns: 1fr 2fr;
  gap: 2rem;
  padding: 2rem 1.8rem;
  border: 1px solid var(--style-accent);
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(74,122,80,0.06), transparent);
  margin-top: 1rem;
}
@media (max-width: 800px) { .verde-testimonio { grid-template-columns: 1fr; } }
.verde-testimonio .photo {
  aspect-ratio: 4 / 5;
  background-size: cover; background-position: center;
  border-radius: 12px;
}
.verde-testimonio .text-block .qm {
  font-family: var(--style-italic), serif;
  font-style: italic;
  font-size: 5rem; line-height: .3;
  color: var(--style-accent);
  margin-bottom: 1rem;
  display: block;
}
.verde-testimonio .text-block blockquote {
  font-family: var(--style-italic), serif;
  font-style: italic;
  font-size: 1.4rem; line-height: 1.45;
  color: var(--style-ink);
  margin-bottom: 1.2rem;
}
.verde-testimonio .text-block cite {
  font-family: 'JetBrains Mono', monospace;
  font-style: normal;
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  color: var(--style-soft);
  text-transform: uppercase;
  display: block;
  padding-top: 1rem;
  border-top: 1px dashed var(--style-line);
}
.verde-testimonio .text-block cite b {
  color: var(--style-accent);
  font-weight: 700;
  display: inline-block;
  margin-right: .5rem;
}

/* Partners grid (verde) */
.verde-partners { display: grid; grid-template-columns: repeat(4, 1fr); gap: .55rem; }
@media (max-width: 800px) { .verde-partners { grid-template-columns: repeat(2, 1fr); } }
.verde-partner {
  aspect-ratio: 4 / 3;
  border: 1px solid var(--style-line);
  border-radius: 10px;
  background: var(--style-bg2);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 1rem;
  transition: transform .25s, border-color .25s;
}
.verde-partner:hover { transform: translateY(-3px); border-color: var(--style-accent); }
.verde-partner .pn {
  font-family: var(--style-display), serif;
  font-weight: 700;
  font-size: 1.2rem;
  color: var(--style-ink);
  text-transform: uppercase;
  letter-spacing: -0.01em;
  margin-bottom: .35rem;
}
.verde-partner .ps {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.12em;
  color: var(--style-accent);
  text-transform: uppercase;
}

/* ====================================
   COMM STRATEGY DEEP
   ==================================== */
.persona-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1rem; margin-top: 1.5rem;
}
@media (max-width: 1000px) { .persona-grid { grid-template-columns: 1fr; } }
.persona-card {
  padding: 1.8rem 1.6rem;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--bg2);
  border-top: 4px solid var(--p-color, var(--accent));
  display: flex; flex-direction: column; gap: 1rem;
}
.persona-card .head {
  display: flex; align-items: center; gap: 1rem;
  padding-bottom: 1rem;
  border-bottom: 1px dashed var(--line);
}
.persona-card .av {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--p-color, var(--accent)), var(--bg2));
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--bg);
  font-family: 'Inter Tight', sans-serif;
  font-weight: 800;
  font-size: 1.3rem;
  border: 2px solid var(--p-color, var(--accent));
  flex-shrink: 0;
}
.persona-card .meta b {
  font-family: 'Inter Tight', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
  display: block;
}
.persona-card .meta span {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.66rem;
  letter-spacing: 0.1em;
  color: var(--p-color, var(--accent));
  text-transform: uppercase;
}
.persona-card .quote {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: 1rem;
  line-height: 1.45;
  color: var(--p-color, var(--accent));
}
.persona-card .rows {
  display: flex; flex-direction: column;
  gap: .55rem;
  padding-top: .8rem;
  border-top: 1px dashed var(--line);
}
.persona-card .row {
  display: grid; grid-template-columns: 80px 1fr;
  gap: .8rem;
  font-size: 0.82rem; line-height: 1.5;
}
.persona-card .row b {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.16em;
  color: var(--ink-soft);
  text-transform: uppercase;
  font-weight: 600;
}
.persona-card .row span { color: var(--ink); }

/* Customer Journey */
.journey-wrap {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: .55rem; margin-top: 1.5rem;
  position: relative;
}
@media (max-width: 1100px) { .journey-wrap { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 700px)  { .journey-wrap { grid-template-columns: 1fr; } }
.journey-step {
  padding: 1.3rem 1.2rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg2);
  position: relative;
}
.journey-step .stage {
  font-family: 'Inter Tight', sans-serif;
  font-weight: 800;
  font-size: 2rem;
  color: var(--accent);
  line-height: 1;
  letter-spacing: -0.03em;
  margin-bottom: .55rem;
}
.journey-step h6 {
  font-family: 'Inter Tight', sans-serif;
  font-weight: 700; font-size: 0.95rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
  margin-bottom: .55rem;
}
.journey-step .think {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: 0.85rem;
  color: var(--accent);
  line-height: 1.4;
  margin-bottom: .8rem;
  padding-bottom: .8rem;
  border-bottom: 1px dashed var(--line);
}
.journey-step .channel,
.journey-step .action {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.1em;
  color: var(--ink-soft);
  text-transform: uppercase;
  margin-bottom: .35rem;
}
.journey-step .channel b,
.journey-step .action b {
  color: var(--accent3);
  display: block;
  font-weight: 600;
  margin-top: .15rem;
}

/* Message Matrix table */
.message-matrix {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg2);
}
.message-matrix table {
  width: 100%; border-collapse: collapse;
  font-size: 0.85rem;
  min-width: 720px;
}
.message-matrix thead th {
  padding: .9rem 1rem;
  text-align: left;
  background: rgba(0,0,0,0.30);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.16em;
  color: var(--ink-soft);
  text-transform: uppercase;
  border-bottom: 1px solid var(--line);
}
.message-matrix tbody td {
  padding: 1rem 1rem;
  color: var(--ink-soft);
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.message-matrix tbody td:first-child {
  font-family: 'Inter Tight', sans-serif;
  font-weight: 700;
  font-size: 0.92rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
}
.message-matrix tbody td:first-child small {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.1em;
  color: var(--accent);
  font-weight: 500;
  margin-top: .25rem;
  text-transform: uppercase;
}
.message-matrix tbody tr:last-child td { border-bottom: 0; }
.message-matrix tbody td em {
  font-style: italic;
  color: var(--ink);
  display: block;
  margin-top: .35rem;
  font-size: 0.75rem;
}

/* Editorial calendar sampler */
.cal-sampler {
  display: grid; grid-template-columns: 100px repeat(4, 1fr);
  gap: .35rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
}
.cal-sampler .cal-cell {
  padding: .8rem .8rem;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink-soft);
}
.cal-sampler .cal-head {
  background: rgba(255,90,31,0.10);
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.16em;
  font-weight: 600;
  font-size: 0.62rem;
  display: flex; align-items: center;
}
.cal-sampler .cal-week {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent3);
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: .8rem .8rem;
  display: flex; align-items: center;
  font-weight: 600;
}
.cal-sampler .cal-cell .pillar-tag {
  display: inline-block;
  font-size: 0.55rem;
  padding: .15rem .4rem;
  border-radius: 4px;
  letter-spacing: 0.08em;
  margin-bottom: .35rem;
  text-transform: uppercase;
}
.cal-sampler .cal-cell .pillar-tag.p1 { background: rgba(255,90,31,0.15); color: var(--accent); }
.cal-sampler .cal-cell .pillar-tag.p2 { background: rgba(201,242,92,0.15); color: var(--accent2); }
.cal-sampler .cal-cell .pillar-tag.p3 { background: rgba(242,193,43,0.15); color: var(--accent3); }
.cal-sampler .cal-cell .pillar-tag.p4 { background: rgba(255,31,107,0.15); color: #FF1F6B; }
.cal-sampler .cal-cell b {
  display: block;
  font-family: 'Inter Tight', sans-serif;
  font-weight: 600;
  font-size: 0.78rem;
  color: var(--ink);
  letter-spacing: -0.005em;
  margin-top: .15rem;
}

/* ====================================
   SHOWCASE TAB
   ==================================== */
.showcase-section {
  padding: 1rem 0;
}
.showcase-hero {
  padding: 2rem 0 2.5rem;
  border-bottom: 1px solid var(--line);
  margin-bottom: 2rem;
}
.showcase-hero .kicker {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.66rem; letter-spacing: 0.22em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 1rem;
  display: inline-block;
}
.showcase-hero h2 {
  font-family: 'Inter Tight', sans-serif;
  font-weight: 800;
  font-size: clamp(2rem, 4.6vw, 3.4rem);
  line-height: 1; letter-spacing: -0.025em;
  color: var(--ink);
  text-transform: uppercase;
  margin-bottom: 1.2rem;
}
.showcase-hero h2 em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  color: var(--accent);
  font-weight: 400;
  text-transform: none;
}
.showcase-hero p {
  font-size: 1rem; line-height: 1.65;
  color: var(--ink-soft);
  max-width: 760px;
}

.showcase-tabs {
  display: flex; gap: .55rem;
  margin-bottom: 1.4rem;
  flex-wrap: wrap;
}
.showcase-tab {
  padding: .55rem 1rem;
  border: 1px solid var(--line);
  border-radius: 100px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.16em;
  color: var(--ink-soft);
  text-transform: uppercase;
  cursor: pointer;
  transition: all .25s;
  background: var(--bg2);
}
.showcase-tab:hover { color: var(--ink); border-color: var(--accent); }
.showcase-tab.active {
  color: #0E1117;
  background: var(--accent);
  border-color: var(--accent);
  font-weight: 600;
}

.showcase-cluster {
  margin-bottom: 2.5rem;
}
.showcase-cluster-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 1rem;
  padding-bottom: .8rem;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap; gap: .55rem;
}
.showcase-cluster-head h3 {
  font-family: 'Inter Tight', sans-serif;
  font-weight: 700;
  font-size: 1.4rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.015em;
}
.showcase-cluster-head h3 em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  color: var(--cluster-accent, var(--accent));
  font-weight: 400;
  text-transform: none;
}
.showcase-cluster-head .count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem;
  color: var(--cluster-accent, var(--accent));
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.showcase-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: .65rem;
}
@media (max-width: 1100px) { .showcase-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 700px)  { .showcase-grid { grid-template-columns: repeat(2, 1fr); } }
.showcase-tile {
  aspect-ratio: var(--tile-ratio, 1 / 1);
  border-radius: 10px;
  background-size: cover; background-position: center;
  background-color: var(--bg2);
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  transition: transform .3s, box-shadow .3s;
  cursor: pointer;
}
.showcase-tile:hover { transform: translateY(-3px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
.showcase-tile.r16-9 { aspect-ratio: 16 / 9; }
.showcase-tile.r3-4  { aspect-ratio: 3 / 4; }
.showcase-tile.r9-16 { aspect-ratio: 9 / 16; }
.showcase-tile::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.6) 100%);
  pointer-events: none;
}
.showcase-tile .meta {
  position: absolute; bottom: .65rem; left: .8rem; right: .8rem;
  z-index: 2;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.55rem; letter-spacing: 0.16em;
  color: #fff;
  text-transform: uppercase;
}
.showcase-tile .meta b {
  display: block;
  font-family: 'Inter Tight', sans-serif;
  font-weight: 700; font-size: 0.78rem;
  letter-spacing: -0.005em;
  text-transform: uppercase;
  margin-top: .25rem;
}

.showcase-videos {
  display: grid; grid-template-columns: 1.6fr 1fr;
  gap: 1rem;
}
@media (max-width: 900px) { .showcase-videos { grid-template-columns: 1fr; } }
.showcase-video {
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--bg2);
  position: relative;
}
.showcase-video video {
  width: 100%; height: 100%; object-fit: cover;
  display: block;
}
.showcase-video.horizontal { aspect-ratio: 16 / 9; }
.showcase-video.vertical { aspect-ratio: 9 / 16; max-width: 320px; margin: 0 auto; }
.showcase-video .vmeta {
  position: absolute; left: 1rem; bottom: 1rem;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(8px);
  padding: .5rem .8rem;
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.16em;
  color: #fff;
  text-transform: uppercase;
}
.showcase-video .vmeta b {
  display: block;
  font-family: 'Inter Tight', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: -0.005em;
  text-transform: uppercase;
  margin-top: .25rem;
}

/* ====================================
   W.4 · DIGITALS CUT · RECOMENDADA ★
   ==================================== */
.dc-shell {
  position: relative;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 1.5rem;
  background: #F2EFE6;
  color: #1A1814;
  box-shadow: 0 50px 100px -40px rgba(0,0,0,0.65);
  border: 1px solid rgba(26,24,20,0.10);
}
.dc-shell .browser-bar {
  display: flex; align-items: center; gap: .55rem;
  padding: .7rem .9rem;
  background: #EDE3CC;
  border-bottom: 1px solid rgba(26,24,20,0.10);
}
.dc-shell .browser-bar .dot { width: 11px; height: 11px; border-radius: 50%; }
.dc-shell .browser-bar .url {
  margin-left: 1rem;
  padding: .35rem .8rem;
  background: #FFFFFF;
  border: 1px solid #ddd;
  border-radius: 100px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.66rem;
  color: #666;
  flex: 1; text-align: center;
}

  position: relative;
  min-height: 720px;
  padding: 3.5rem 3rem;

}
.dc-hero .dc-video {

  object-fit: cover;
  z-index: 0;
}

  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(11,10,8,0.30) 0%, rgba(11,10,8,0.20) 30%, rgba(11,10,8,0.55) 75%, #F2EFE6 100%);

  font-size: 0.62rem; letter-spacing: 0.18em;

  text-transform: uppercase;
  text-shadow: 0 1px 6px rgba(0,0,0,0.4);

.dc-hero .dc-logo {
  font-family: 'Inter Tight', sans-serif;
  font-weight: 800; font-size: 1rem;
  letter-spacing: 0.02em;
}
.dc-hero .dc-logo em { color: #FFCE00; font-style: normal; }
.dc-hero .dc-menu { display: flex; gap: 1.4rem; opacity: .9; }
.dc-hero .dc-menu .pill {

  border-radius: 100px;

.dc-hero .dc-content {
  position: relative; z-index: 2;

  margin-top: 5rem;
}
.dc-hero .dc-badge {
  display: inline-flex; align-items: center; gap: .55rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.66rem; letter-spacing: 0.22em;
  color: #FFCE00;
  background: rgba(11,10,8,0.55);
  border: 1px solid rgba(242,193,43,0.40);
  padding: .5rem 1rem;
  border-radius: 100px;

.dc-hero .dc-badge .star { color: #FFCE00; font-size: 1rem; line-height: 1; }
.dc-hero h1 {
  font-family: 'Inter Tight', sans-serif;
  font-weight: 800;
  font-size: clamp(2.6rem, 6vw, 5rem);
  line-height: 0.94;
  letter-spacing: -0.028em;
  color: #FFFFFF;
  text-transform: uppercase;
  text-shadow: 0 4px 30px rgba(0,0,0,0.6);
  margin-bottom: 1.2rem;
}
.dc-hero h1 em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-weight: 500;
  color: #FFCE00;
  text-transform: none;
}
.dc-hero .dc-sub {
  font-size: 1.15rem; line-height: 1.6;
  color: rgba(255,255,255,0.92);
  max-width: 580px;
  margin-bottom: 1.8rem;
  text-shadow: 0 2px 12px rgba(0,0,0,0.5);
}
.dc-hero .dc-cta-row { display: flex; gap: .7rem; flex-wrap: wrap; }
.dc-hero .dc-cta-primary {
  background: linear-gradient(135deg, #FFCE00, #FFCE00);
  color: #0E1117;
  font-family: 'Inter Tight', sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  padding: .9rem 1.6rem;
  border-radius: 100px;
  letter-spacing: 0.005em;
  text-transform: uppercase;
  box-shadow: 0 14px 40px -8px rgba(242,193,43,0.50);
  cursor: pointer; border: 0;
}
.dc-hero .dc-cta-secondary {

function V2AnimatedStats() {
  const ref = React.useRef(null);
  const [vals, setVals] = React.useState([0, 0, 0]);
  const targets = [20, 2050, 21000];
  const labels = ['Años en el mercado', 'Equipos en flota total ALO Group', 'Contratos atendidos histórico'];
  const suffix = ['', '+', '+'];
  const prefix = ['', '', ''];

  React.useEffect(() => {
    if (!ref.current) return;
    let raf;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const start = performance.now();
          const duration = 1600;
          const step = (now) => {
            const t = Math.min(1, (now - start) / duration);
            const eased = 1 - Math.pow(1 - t, 3);
            setVals(targets.map(target => Math.round(target * eased)));
            if (t < 1) raf = requestAnimationFrame(step);
          };
          raf = requestAnimationFrame(step);
          io.disconnect();
        }
      });
    }, { threshold: 0.3 });
    io.observe(ref.current);
    return () => { io.disconnect(); if (raf) cancelAnimationFrame(raf); };
  }, []);

  const fmt = (n) => n.toLocaleString('es-CL');

  return (
    <div ref={ref} style={{ background: '#0E1117', padding: '2.5rem 2.5rem', borderTop: '3px solid #FFCE00', borderBottom: '3px solid #FFCE00', position: 'relative', overflow: 'hidden' }}>
      <div style={{ position: 'absolute', top: 0, left: '50%', transform: 'translateX(-50%)', width: '60%', height: 2, background: 'linear-gradient(90deg, transparent, #FFCE00, transparent)', filter: 'blur(2px)' }}/>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '1.4rem', position: 'relative', zIndex: 2 }}>
        {targets.map((_, i) => (
          <div key={i} style={{ textAlign: 'center', padding: '.6rem .4rem', borderRight: i < 2 ? '1px solid rgba(255,206,0,0.20)' : 'none' }}>
            <div style={{ fontFamily: 'Inter Tight, sans-serif', fontWeight: 900, fontSize: '3.4rem', color: '#FFCE00', lineHeight: 1, letterSpacing: '-0.03em', textShadow: '0 0 30px rgba(255,206,0,0.45)' }}>
              {prefix[i]}{fmt(vals[i])}{suffix[i]}
            </div>
            <div style={{ marginTop: '.4rem', fontFamily: 'JetBrains Mono, monospace', fontSize: '.7rem', letterSpacing: '.14em', color: 'rgba(255,255,255,0.7)', fontWeight: 700, textTransform: 'uppercase' }}>{labels[i]}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const initial = (window.location.hash || '#summary').replace('#', '');
  const [section, setSection] = useState(initial);
  const [mobileNav, setMobileNav] = useState(false);

  // Hash sync · resolve broken links
  useEffect(() => {
    const onHash = () => setSection((window.location.hash || '#summary').replace('#', ''));
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  useEffect(() => { if (window.location.hash !== '#' + section) window.location.hash = '#' + section; window.scrollTo({ top: 0, behavior: 'auto' }); }, [section]);

  // Cursor trail
  useEffect(() => {
    if (window.matchMedia('(hover: none)').matches) return;
    const t = document.createElement('div');
    t.className = 'cursor-trail';
    document.body.appendChild(t);
    const onMove = (e) => {
      t.style.left = e.clientX + 'px';
      t.style.top = e.clientY + 'px';
    };
    document.addEventListener('mousemove', onMove);
    return () => {
      document.removeEventListener('mousemove', onMove);
      t.remove();
    };
  }, []);

  // Tilt effect on .tilt elements
  useEffect(() => {
    const tm = setTimeout(() => {
      const cards = document.querySelectorAll('.tilt');
      cards.forEach(card => {
        if (card.__tiltInit) return;
        card.__tiltInit = true;
        let raf = null;
        let rx = 0, ry = 0, tx = 0, ty = 0;
        const glare = document.createElement('div');
        glare.style.cssText = 'position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%, rgba(244,236,220,0.10), transparent 50%);opacity:0;mix-blend-mode:screen;border-radius:inherit;transition:opacity .25s';
        if (getComputedStyle(card).position === 'static') card.style.position = 'relative';
        card.appendChild(glare);
        const apply = () => {
          card.style.transform = `perspective(900px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translate3d(${tx.toFixed(1)}px,${ty.toFixed(1)}px,0)`;
          raf = null;
        };
        const onEnter = () => { glare.style.opacity = '1'; };
        const onMove = (e) => {
          const r = card.getBoundingClientRect();
          const x = (e.clientX - r.left) / r.width - 0.5;
          const y = (e.clientY - r.top) / r.height - 0.5;
          rx = -y * 10; ry = x * 14; tx = x * 5; ty = y * 5;
          glare.style.background = `radial-gradient(circle at ${(x+0.5)*100}% ${(y+0.5)*100}%, rgba(255,90,31,0.18), transparent 55%)`;
          if (!raf) raf = requestAnimationFrame(apply);
        };
        const onLeave = () => {
          rx = 0; ry = 0; tx = 0; ty = 0;
          glare.style.opacity = '0';
          if (raf) cancelAnimationFrame(raf);
          card.style.transition = 'transform .55s cubic-bezier(.2,.8,.2,1)';
          requestAnimationFrame(apply);
          setTimeout(() => { card.style.transition = ''; }, 600);
        };
        card.addEventListener('mouseenter', onEnter);
        card.addEventListener('mousemove', onMove);
        card.addEventListener('mouseleave', onLeave);
        card.style.willChange = 'transform';
        card.style.transformStyle = 'preserve-3d';
      });
    }, 80);
    return () => clearTimeout(tm);
  }, [section]);

  function renderSection() {
    switch (section) {
      case 'summary':    return <SummarySection/>;
      case 'brief':      return <BriefSection/>;
      case 'audit':      return <AuditSection/>;
      case 'market':     return <MarketSection/>;
      case 'insights':   return <InsightsSection/>;
      case 'comm':       return <CommSection/>;
      case 'pillars':    return <PillarsSection/>;
      case 'graphic':    return <GraphicSection/>;
      case 'funnel':     return <FunnelSection/>;
      case 'web-digitalscut': return <DigitalsCutSection/>;
      case 'web-tailored-v2': return <WebTailoredV2Section/>;
      case 'showcase':       return <ShowcaseSection/>;
      default:           return <SummarySection/>;
    }
  }

  return (
    <>
      <button className={'shell-burger ' + (mobileNav ? 'open' : '')} onClick={() => setMobileNav(!mobileNav)} aria-label="Menú">
        <span/><span/><span/>
      </button>
      <div className={'shell-backdrop ' + (mobileNav ? 'show' : '')} onClick={() => setMobileNav(false)}/>
      <div className={'shell-sidebar-wrap ' + (mobileNav ? 'open' : '')}>
        <Sidebar section={section} setSection={setSection} onClickItem={() => setMobileNav(false)}/>
      </div>
      <div className="content">{renderSection()}</div>
    </>
  );
}
